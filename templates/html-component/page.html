<!doctype html>
<!--
  __NAME__  —  Wix HtmlComponent (iframe) content. 100% code-owned.
  Bridge to Velo is postMessage ONLY (the iframe is sandboxed; no $w, no cookies).
    Velo  -> iframe:  $w('#__ID__').postMessage({...})
    iframe -> Velo:   window.parent.postMessage({...}, '*')   ->  $w('#__ID__').onMessage(fn)
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { margin:0; font-family: system-ui, sans-serif; }
      .wrap { padding:24px; background:#0f172a; color:#fff; border-radius:16px; }
      button { margin-top:12px; padding:10px 18px; border:0; border-radius:10px;
               background:#22d3ee; color:#0f172a; font-weight:600; cursor:pointer; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h2 id="title">__NAME__</h2>
      <p>Code-owned iframe section.</p>
      <button id="cta" type="button">Send to Velo</button>
    </div>
    <script>
      // Receive messages FROM Velo:
      window.addEventListener('message', (e) => {
        const msg = e.data || {};
        if (msg.type === 'config' && msg.title) {
          document.getElementById('title').textContent = msg.title;
        }
      });
      // Send messages TO Velo:
      document.getElementById('cta').addEventListener('click', () => {
        window.parent.postMessage({ type: 'action', at: Date.now() }, '*');
      });
      // Tell Velo we're ready:
      window.parent.postMessage({ type: 'ready' }, '*');
    </script>
  </body>
</html>
